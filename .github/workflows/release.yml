name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create at the current commit, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: build dist
        run: make dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              echo "release $tag already exists; delete it or bump the tag" >&2
              exit 1
            fi
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            echo "attached assets to existing release $tag"
          else
            args=()
            case "$tag" in
              *-*) args+=(--prerelease) ;;
            esac
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes "${args[@]}"
          fi
