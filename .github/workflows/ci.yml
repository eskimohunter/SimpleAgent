name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: linux (vet, race tests, smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=1 ./...

      - name: build
        run: make build

      - name: smoke test (mock agent)
        shell: bash
        run: |
          d=$(mktemp -d)
          printf 'hello agent world\na\n/exit\n' | ./bin/simpleagent --mock --root "$d" > smoke.log 2>&1
          grep -q 'Hello from mock agent' smoke.log
          grep -q 'echo Hello from mock agent' "$d/.agent/approvals.json"
          test -s "$d/.agent/audit.jsonl"
          echo "smoke test passed"

  windows:
    name: windows (test, build, smoke)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: test
        run: go test -count=1 ./...

      - name: build
        shell: bash
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bin/simpleagent.exe ./cmd/simpleagent

      - name: smoke test (mock agent)
        shell: bash
        run: |
          d=$(mktemp -d)
          printf 'hello agent world\na\n/exit\n' | ./bin/simpleagent.exe --mock --root "$d" > smoke.log 2>&1
          grep -q 'Hello from mock agent' smoke.log
          grep -q 'echo Hello from mock agent' "$d/.agent/approvals.json"
          test -s "$d/.agent/audit.jsonl"
          echo "smoke test passed"
